name: Android model-free CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Repository hygiene
        run: ./scripts/verify-repository-hygiene.sh

      - name: JVM tests
        run: ./gradlew test

      - name: Synthetic Ryeong search evaluation
        run: ./gradlew :search-core:searchEvaluation

      - name: Emulator unit tests and APK
        run: ./gradlew :app:testEmulatorDebugUnitTest :app:assembleEmulatorDebug

      - name: Emulator lint
        run: ./gradlew :app:lintEmulatorDebug

      - name: Verify emulator APK has no model or cache
        run: |
          APK="app/build/outputs/apk/emulator/debug/app-emulator-debug.apk"
          test -f "$APK"
          ! unzip -Z1 "$APK" | grep -Eq '\.(litertlm|onnx|tflite|task|safetensors)$|\.xnnpack_cache_'
